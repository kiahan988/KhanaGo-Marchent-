<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>khanaGo Merchant</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f8fafc; color: #0f172a; padding: 14px; }
    .wrap { max-width: 820px; margin: 0 auto; }

    .top { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
    .top-left { display: flex; align-items: center; gap: 8px; }
    .icon-btn { border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 10px; width: 38px; height: 38px; font-size: 18px; font-weight: 800; cursor: pointer; }
    .brand { font-size: 18px; font-weight: 900; }
    .brand span { color: #ea580c; }
    .top-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .buzzer-btn { border: 1px solid #f59e0b; background: #fef3c7; color: #92400e; padding: 8px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; cursor: pointer; }
    .status-btn { border: none; padding: 9px 13px; border-radius: 999px; font-size: 12px; font-weight: 900; cursor: pointer; }
    .online { background: #dcfce7; color: #166534; }
    .offline { background: #fee2e2; color: #991b1b; }
    .mini-logo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #fdba74; background: #ffedd5; display: none; cursor: pointer; }

    #drawerBackdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 50; }
    .drawer { width: 270px; max-width: 82vw; height: 100%; background: #fff; padding: 14px; overflow-y: auto; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 10px; }
    .menu-item-btn { width: 100%; text-align: left; background: none; border: none; padding: 10px 12px; border-radius: 10px; font-size: 13px; font-weight: 700; color: #1e293b; cursor: pointer; margin-bottom: 4px; }
    .menu-item-btn.active { background: #ffedd5; color: #c2410c; font-weight: 800; }

    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    h2, h3 { margin: 0 0 12px; font-size: 18px; font-weight: 900; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 14px; }
    @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }

    .field { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 800; color: #334155; margin-bottom: 4px; }
    input[type="text"], input[type="tel"], input[type="number"], select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; background: #fff; }
    .prev { width: 78px; height: 62px; object-fit: cover; border-radius: 8px; border: 1px solid #cbd5e1; margin-top: 6px; display: none; }

    .primary-btn { border: none; padding: 11px 15px; border-radius: 10px; background: #ea580c; color: #fff; font-size: 13px; font-weight: 800; cursor: pointer; }
    .sec-btn { border: 1px solid #cbd5e1; background: #fff; color: #0f172a; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; }

    .stat { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; }
    .stat-val { font-size: 22px; font-weight: 900; margin-top: 4px; }

    .info-box { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.65; }
    .docs-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .doc-thumb { width: 84px; height: 68px; object-fit: cover; border-radius: 8px; border: 1px solid #fdba74; display: none; }

    .row-card { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: #fff; }
    .item-on { background: #dcfce7; color: #166534; border: none; padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; cursor: pointer; }
    .item-off { background: #e2e8f0; color: #475569; border: none; padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="top-left">
        <button id="menuOpenBtn" type="button" class="icon-btn">☰</button>
        <div class="brand">khana<span>Go</span></div>
      </div>
      <div class="top-right">
        <button id="buzzerBtn" type="button" class="buzzer-btn">🔔 Buzzer</button>
        <button id="statusBtn" type="button" class="status-btn online">SHOP: ONLINE</button>
        <img id="topLogo" class="mini-logo" alt="Logo" />
      </div>
    </div>

    <div id="drawerBackdrop">
      <aside id="drawerBox" class="drawer">
        <div class="drawer-head">
          <div>
            <div id="drawerTitle" style="font-weight:900;font-size:15px;">khanaGo Merchant</div>
            <div style="font-size:11px;color:#64748b;">Partner Panel</div>
          </div>
          <button id="menuCloseBtn" type="button" class="icon-btn">&times;</button>
        </div>
        <button type="button" class="menu-item-btn active" data-tab="dashboard">📊 Dashboard</button>
        <button type="button" class="menu-item-btn" data-tab="onboarding">🏪 Shop Onboarding & Docs</button>
        <button type="button" class="menu-item-btn" data-tab="orders">🛍️ Orders</button>
        <button type="button" class="menu-item-btn" data-tab="items">📦 Items & Menu</button>
        <button type="button" class="menu-item-btn" data-tab="wallet">💳 Wallet & Payout</button>
        <button type="button" class="menu-item-btn" data-tab="settings">⚙️ Settings</button>
      </aside>
    </div>

    <div id="setupView" class="card">
      <h2>khanaGo Merchant Onboarding</h2>

      <div class="grid-2">
        <div class="field">
          <label>Shop Name *</label>
          <input type="text" id="shopName" placeholder="Shop ka naam likhein" />
        </div>
        <div class="field">
          <label>Owner Name *</label>
          <input type="text" id="ownerName" placeholder="Owner ka naam" />
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Owner Mobile Number *</label>
          <input type="tel" id="ownerPhone" maxlength="10" placeholder="10 digit mobile" />
        </div>
        <div class="field">
          <label>Bank Account Number *</label>
          <input type="text" id="bankAcc" placeholder="Bank account number" />
        </div>
      </div>

      <div class="field">
        <label>FSSAI Licence Number *</label>
        <input type="text" id="fssaiNo" placeholder="FSSAI licence number" />
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Shop Logo Image</label>
          <input type="file" id="logoFile" accept="image/*" />
          <img id="prevLogo" class="prev" alt="Logo Preview" />
        </div>
        <div class="field">
          <label>Bank / FSSAI Image</label>
          <input type="file" id="docFile" accept="image/*" />
          <img id="prevDoc" class="prev" alt="Doc Preview" />
        </div>
      </div>

      <button id="saveBtn" type="button" class="primary-btn" style="width:100%;">Save & Open Dashboard</button>
      <div id="errMsg" style="margin-top:8px;color:#dc2626;font-size:13px;font-weight:700;"></div>
    </div>

    <div id="dashView" class="card" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
        <h3 id="dashTitle" style="margin:0;">Merchant Dashboard</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button id="simOrderBtn" type="button" class="primary-btn">+ Test Order (Buzzer)</button>
          <button id="editBtn" type="button" class="sec-btn">Edit Shop / Docs</button>
        </div>
      </div>

      <div class="grid-3">
        <div class="stat">
          <div style="font-size:11px;font-weight:800;color:#64748b;">TOTAL ORDERS</div>
          <div id="statOrders" class="stat-val">0</div>
        </div>
        <div class="stat">
          <div style="font-size:11px;font-weight:800;color:#64748b;">ACTIVE ITEMS</div>
          <div id="statItems" class="stat-val">0</div>
        </div>
        <div class="stat">
          <div style="font-size:11px;font-weight:800;color:#64748b;">PAYOUT TOTAL</div>
          <div id="statPayout" class="stat-val">₹0</div>
        </div>
      </div>

      <div id="summaryBox" class="info-box"></div>
      <div class="docs-row">
        <img id="dashLogoImg" class="doc-thumb" alt="Shop Logo" />
        <img id="dashDocImg" class="doc-thumb" alt="Doc Image" />
      </div>
    </div>

    <div id="ordersView" class="card" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
        <h3 style="margin:0;">Orders</h3>
        <button id="simOrderBtn2" type="button" class="primary-btn">+ Test Order (Buzzer)</button>
      </div>
      <div id="ordersList"></div>
    </div>

    <div id="itemsView" class="card" style="display:none;">
      <h3>Menu Items</h3>
      <div class="grid-2">
        <div class="field">
          <label>Item Name *</label>
          <input type="text" id="newItemName" placeholder="e.g. Paneer Thali" />
        </div>
        <div class="field">
          <label>Price (₹) *</label>
          <input type="number" id="newItemPrice" min="1" placeholder="e.g. 120" />
        </div>
      </div>
      <button id="addItemBtn" type="button" class="primary-btn" style="margin-bottom:14px;">+ Add Menu Item</button>
      <div id="itemsList"></div>
    </div>

    <div id="extraView" class="card" style="display:none;">
      <h3 id="extraTitle">Details</h3>
      <div id="extraBody" class="info-box"></div>
    </div>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = "khanago_merchant_step3_fixed";
      var state = {
        online: true,
        onboarded: false,
        activeTab: "dashboard",
        shopName: "",
        ownerName: "",
        ownerPhone: "",
        bankAcc: "",
        fssaiNo: "",
        logo: "",
        docImg: "",
        items: [
          { id: 1, name: "Special Thali", price: 120, active: true },
          { id: 2, name: "Paneer Paratha", price: 80, active: true }
        ],
        orders: []
      };

      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === "object") {
            if (typeof parsed.online === "boolean") state.online = parsed.online;
            if (typeof parsed.onboarded === "boolean") state.onboarded = parsed.onboarded;
            if (typeof parsed.activeTab === "string") state.activeTab = parsed.activeTab;
            if (typeof parsed.shopName === "string") state.shopName = parsed.shopName;
            if (typeof parsed.ownerName === "string") state.ownerName = parsed.ownerName;
            if (typeof parsed.ownerPhone === "string") state.ownerPhone = parsed.ownerPhone;
            if (typeof parsed.bankAcc === "string") state.bankAcc = parsed.bankAcc;
            if (typeof parsed.fssaiNo === "string") state.fssaiNo = parsed.fssaiNo;
            if (typeof parsed.logo === "string") state.logo = parsed.logo;
            if (typeof parsed.docImg === "string") state.docImg = parsed.docImg;
            if (Array.isArray(parsed.items) && parsed.items.length) state.items = parsed.items;
            if (Array.isArray(parsed.orders)) state.orders = parsed.orders;
          }
        }
      } catch (e) {}

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      function playBuzzer(showAlert) {
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            var ctx = new AC();
            var now = ctx.currentTime;
            var times = [0, 0.25, 0.5];
            for (var i = 0; i < times.length; i++) {
              var osc = ctx.createOscillator();
              var gain = ctx.createGain();
              osc.type = "sawtooth";
              osc.frequency.setValueAtTime(760, now + times[i]);
              gain.gain.setValueAtTime(0.2, now + times[i]);
              gain.gain.exponentialRampToValueAtTime(0.001, now + times[i] + 0.19);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + times[i]);
              osc.stop(now + times[i] + 0.2);
            }
          }
        } catch (e) {}
        if (showAlert) {
          alert("🔔 Order Buzzer Played!");
        }
      }

      function setImg(el, src) {
        if (!el) return;
        if (src) {
          el.src = src;
          el.style.display = "block";
        } else {
          el.style.display = "none";
        }
      }

      function applyView() {
        document.getElementById("setupView").style.display = "none";
        document.getElementById("dashView").style.display = "none";
        document.getElementById("ordersView").style.display = "none";
        document.getElementById("itemsView").style.display = "none";
        document.getElementById("extraView").style.display = "none";

        var tab = state.onboarded ? state.activeTab : "onboarding";
        if (tab === "onboarding") {
          document.getElementById("setupView").style.display = "block";
        } else if (tab === "orders") {
          document.getElementById("ordersView").style.display = "block";
        } else if (tab === "items") {
          document.getElementById("itemsView").style.display = "block";
        } else if (tab === "wallet" || tab === "settings") {
          var total = 0;
          for (var i = 0; i < state.orders.length; i++) {
            if (state.orders[i].status !== "Cancelled") total += Number(state.orders[i].amount || 0);
          }
          document.getElementById("extraView").style.display = "block";
          document.getElementById("extraTitle").textContent = tab === "wallet" ? "Wallet & Payout" : "Merchant Settings";
          document.getElementById("extraBody").innerHTML =
            "<strong>Shop:</strong> " + (state.shopName || "-") + "<br>" +
            "<strong>Bank Account:</strong> " + (state.bankAcc || "-") + "<br>" +
            "<strong>FSSAI Licence:</strong> " + (state.fssaiNo || "-") + "<br>" +
            "<strong>Total Earnings:</strong> ₹" + total;
        } else {
          document.getElementById("dashView").style.display = "block";
        }

        var navBtns = document.querySelectorAll(".menu-item-btn");
        for (var j = 0; j < navBtns.length; j++) {
          if (navBtns[j].getAttribute("data-tab") === tab) {
            navBtns[j].classList.add("active");
          } else {
            navBtns[j].classList.remove("active");
          }
        }
      }

      function renderOrders() {
        var box = document.getElementById("ordersList");
        if (!state.orders.length) {
          box.innerHTML = "<div class='info-box'>Abhi koi order nahi aaya hai. '+ Test Order (Buzzer)' dabayein.</div>";
          return;
        }
        var statuses = ["New", "Preparing", "Ready", "Completed", "Cancelled"];
        var html = "";
        for (var i = 0; i < state.orders.length; i++) {
          var ord = state.orders[i];
          var opts = "";
          for (var s = 0; s < statuses.length; s++) {
            var st = statuses[s];
            opts += "<option value='" + st + "'" + (ord.status === st ? " selected" : "") + ">" + st + "</option>";
          }
          html +=
            "<div class='row-card'>" +
              "<div><strong>Order #" + ord.id + " • ₹" + ord.amount + "</strong><div style='font-size:12px;color:#64748b;'>" + ord.item + "</div></div>" +
              "<select class='ord-status-sel' data-id='" + ord.id + "' style='width:auto;'>" + opts + "</select>" +
            "</div>";
        }
        box.innerHTML = html;

        var selects = box.querySelectorAll(".ord-status-sel");
        for (var k = 0; k < selects.length; k++) {
          selects[k].addEventListener("change", function () {
            var oid = Number(this.getAttribute("data-id"));
            var val = this.value;
            for (var m = 0; m < state.orders.length; m++) {
              if (state.orders[m].id === oid) {
                state.orders[m].status = val;
                break;
              }
            }
            persist();
            renderAll();
          });
        }
      }

      function renderItems() {
        var box = document.getElementById("itemsList");
        var html = "";
        for (var i = 0; i < state.items.length; i++) {
          var it = state.items[i];
          html +=
            "<div class='row-card'>" +
              "<div><strong>" + it.name + "</strong><div style='font-size:12px;color:#ea580c;font-weight:800;'>₹" + it.price + "</div></div>" +
              "<button type='button' class='item-toggle-btn " + (it.active ? "item-on" : "item-off") + "' data-id='" + it.id + "'>" + (it.active ? "ON" : "OFF") + "</button>" +
            "</div>";
        }
        box.innerHTML = html;

        var btns = box.querySelectorAll(".item-toggle-btn");
        for (var j = 0; j < btns.length; j++) {
          btns[j].addEventListener("click", function () {
            var iid = Number(this.getAttribute("data-id"));
            for (var k = 0; k < state.items.length; k++) {
              if (state.items[k].id === iid) {
                state.items[k].active = !state.items[k].active;
                break;
              }
            }
            persist();
            renderAll();
          });
        }
      }

      function renderAll() {
        var statusBtn = document.getElementById("statusBtn");
        if (state.online) {
          statusBtn.textContent = "SHOP: ONLINE";
          statusBtn.className = "status-btn online";
        } else {
          statusBtn.textContent = "SHOP: OFFLINE";
          statusBtn.className = "status-btn offline";
        }

        document.getElementById("drawerTitle").textContent = state.shopName || "khanaGo Merchant";
        document.getElementById("shopName").value = state.shopName || "";
        document.getElementById("ownerName").value = state.ownerName || "";
        document.getElementById("ownerPhone").value = state.ownerPhone || "";
        document.getElementById("bankAcc").value = state.bankAcc || "";
        document.getElementById("fssaiNo").value = state.fssaiNo || "";

        setImg(document.getElementById("topLogo"), state.logo);
        setImg(document.getElementById("prevLogo"), state.logo);
        setImg(document.getElementById("prevDoc"), state.docImg);
        setImg(document.getElementById("dashLogoImg"), state.logo);
        setImg(document.getElementById("dashDocImg"), state.docImg);

        var activeItemsCount = 0;
        for (var i = 0; i < state.items.length; i++) {
          if (state.items[i].active) activeItemsCount++;
        }

        var payout = 0;
        for (var j = 0; j < state.orders.length; j++) {
          if (state.orders[j].status !== "Cancelled") payout += Number(state.orders[j].amount || 0);
        }

        document.getElementById("statOrders").textContent = state.orders.length;
        document.getElementById("statItems").textContent = activeItemsCount;
        document.getElementById("statPayout").textContent = "₹" + payo
