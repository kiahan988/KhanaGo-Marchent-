<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>khanaGo Merchant</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; margin: 0; padding: 16px; }
    .box { max-width: 500px; margin: auto; background: #fff; padding: 16px; border-radius: 12px; border: 1px solid #ddd; }
    input, button { width: 100%; padding: 12px; margin-top: 10px; font-size: 15px; border-radius: 8px; }
    input { border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #ea580c; color: #fff; border: none; font-weight: bold; cursor: pointer; }
    #out { margin-top: 14px; padding: 12px; background: #fff7ed; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h3>khanaGo Merchant Setup</h3>
    <input type="text" id="sname" placeholder="Shop ka naam likhein" />
    <button id="sbtn" type="button">Save Shop</button>
    <div id="out"></div>
  </div>

  <script>
    document.getElementById("sbtn").addEventListener("click", function () {
      var val = document.getElementById("sname").value.trim();
      var out = document.getElementById("out");
      if (!val) {
        out.style.display = "block";
        out.textContent = "Pehle shop ka naam likhein.";
        return;
      }
      out.style.display = "block";
      out.textContent = "Saved Shop: " + val;
    });
  </script>
</body>
</html>
