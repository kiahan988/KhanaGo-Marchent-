<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>khanaGo Merchant Onboarding</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #f8fafc; color: #0f172a; padding: 14px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    .top-bar { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .brand { font-size: 20px; font-weight: 900; }
    .brand span { color: #ea580c; }
    .toggle-btn { border: none; padding: 10px 16px; border-radius: 999px; font-weight: 900; font-size: 13px; cursor: pointer; }
    .online { background: #dcfce7; color: #166534; }
    .offline { background: #fee2e2; color: #991b1b; }

    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    h2 { margin: 0 0 12px; font-size: 18px; font-weight: 900; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 4px; color: #334155; }
    input[type="text"], input[type="tel"] { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; }
    .prev { width: 80px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid #cbd5e1; margin-top: 6px; display: none; }
    .save-btn { width: 100%; border: none; padding: 13px; border-radius: 12px; background: linear-gradient(135deg, #FF512F, #F09819); color: #fff; font-size: 15px; font-weight: 900; cursor: pointer; }
    .msg { margin-top: 10px; font-size: 13px; font-weight: 800; color: #15803d; }
    .preview-card { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 14px; padding: 14px; font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-bar">
      <div class="brand">khana<span>Go</span> <span style="font-size:12px;color:#64748b;font-weight:700;">Merchant</span></div>
      <button type="button" id="statusBtn" class="toggle-btn online" onclick="toggleShop()">SHOP: ONLINE</button>
    </div>

    <div class="card">
      <h2>Shop Onboarding & Documents</h2>
      <form id="shopForm" onsubmit="handleSave(event)">
        <div class="grid-2">
          <div class="field">
            <label>Shop Name *</label>
            <input type="text" id="shopName" required placeholder="Shop ka naam" />
          </div>
          <div class="field">
            <label>Owner Full Name *</label>
            <input type="text" id="ownerName" required placeholder="Owner ka naam" />
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label>Owner Mobile Number *</label>
            <input type="tel" id="ownerPhone" required pattern="[0-9]{10}" maxlength="10" placeholder="10 digit mobile" />
          </div>
          <div class="field">
            <label>Bank Account Number *</label>
            <input type="text" id="bankAcc" required placeholder="Account number" />
          </div>
        </div>

        <div class="field">
          <label>FSSAI Licence Number *</label>
          <input type="text" id="fssaiNo" required placeholder="FSSAI licence number" />
        </div>

        <div class="grid-2">
          <div class="field">
            <label>Shop Logo Image</label>
            <input type="file" accept="image/*" onchange="readImg(event, 'logo')" />
            <img id="imgLogo" class="prev" alt="Logo" />
          </div>
          <div class="field">
            <label>Bank / FSSAI Image</label>
            <input type="file" accept="image/*" onchange="readImg(event, 'docImg')" />
            <img id="imgDoc" class="prev" alt="Doc" />
          </div>
        </div>

        <button type="submit" class="save-btn">Save Shop Details</button>
        <div id="saveStatus" class="msg"></div>
      </form>
    </div>

    <div class="card">
      <h2>Saved Shop Summary</h2>
      <div id="summaryBox" class="preview-card">Abhi koi shop save nahi hui hai.</div>
    </div>
  </div>

  <script>
    var KEY = "khanago_simple_merchant_v1";
    var data = {
      online: true,
      shopName: "",
      ownerName: "",
      ownerPhone: "",
      bankAcc: "",
      fssaiNo: "",
      logo: "",
      docImg: ""
    };

    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        for (var k in parsed) {
          data[k] = parsed[k];
        }
      }
    } catch (e) {}

    function saveLocal() {
      try {
        localStorage.setItem(KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function toggleShop() {
      data.online = !data.online;
      saveLocal();
      renderView();
    }

    function readImg(ev, key) {
      var file = ev.target.files && ev.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        data[key] = e.target.result;
        saveLocal();
        renderView();
      };
      reader.readAsDataURL(file);
    }

    function handleSave(e) {
      e.preventDefault();
      data.shopName = document.getElementById("shopName").value.trim();
      data.ownerName = document.getElementById("ownerName").value.trim();
      data.ownerPhone = document.getElementById("ownerPhone").value.trim();
      data.bankAcc = document.getElementById("bankAcc").value.trim();
      data.fssaiNo = document.getElementById("fssaiNo").value.trim();
      saveLocal();
      document.getElementById("saveStatus").textContent = "Shop details save ho gayi hain!";
      renderView();
    }

    function renderView() {
      var btn = document.getElementById("statusBtn");
      if (data.online) {
        btn.textContent = "SHOP: ONLINE";
        btn.className = "toggle-btn online";
      } else {
        btn.textContent = "SHOP: OFFLINE";
        btn.className = "toggle-btn offline";
      }

      document.getElementById("shopName").value = data.shopName || "";
      document.getElementById("ownerName").value = data.ownerName || "";
      document.getElementById("ownerPhone").value = data.ownerPhone || "";
      document.getElementById("bankAcc").value = data.bankAcc || "";
      document.getElementById("fssaiNo").value = data.fssaiNo || "";

      var logoEl = document.getElementById("imgLogo");
      if (data.logo) {
        logoEl.src = data.logo;
        logoEl.style.display = "block";
      }

      var docEl = document.getElementById("imgDoc");
      if (data.docImg) {
        docEl.src = data.docImg;
        docEl.style.display = "block";
      }

      var box = document.getElementById("summaryBox");
      if (!data.shopName && !data.ownerName) {
        box.innerHTML = "Abhi koi shop save nahi hui hai.";
      } else {
        box.innerHTML =
          "<strong>Shop:</strong> " + (data.shopName || "-") + "<br>" +
          "<strong>Owner:</strong> " + (data.ownerName || "-") + " (" + (data.ownerPhone || "-") + ")<br>" +
          "<strong>Account No:</strong> " + (data.bankAcc || "-") + "<br>" +
          "<strong>FSSAI Licence:</strong> " + (data.fssaiNo || "-") + "<br>" +
          "<strong>Status:</strong> " + (data.online ? "ONLINE" : "OFFLINE");
      }
    }

    renderView();
  </script>
</body>
</html>
